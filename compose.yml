services:
  agent:
    build: .
    environment:
      # The Agent Index project id this install reports to. Registered once by
      # the publisher; every installer reports to the same id.
      AGENT_ID: ${AGENT_ID:-sinal-de-vida}
    volumes:
      # `.host`, not the path the agent reads: a bind carries this machine's
      # ownership in, and the image copies the file into place as root itself.
      - ./plow-credentials:/var/lib/plow/credentials.host:ro
      # The agent's home, kept across up/down for its sessions and its state.
      - agent-home:/var/lib/hermes
    # The agent checkpoints its session on SIGTERM and its supervisor allows 30s
    # for that, so Docker's deadline has to sit outside that one.
    stop_grace_period: 35s

volumes:
  agent-home:
